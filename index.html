<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frågesport</title>
<style>
:root{--bg:#dcebf7;--panel:#f3effa;--panel-line:#ddd3ef;--card:#fff;--ink:#1d1b18;--muted:#6b665d;--accent:#2f5a86;--accent-ink:#fff;--tile:#2f5d50;--tile-ink:#f6e7b8;--used:#e2ddd2;--ok:#2e7d4f;--bad:#b3392f;--line:#e2ddd2}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a26;--panel:#1f1a2b;--panel-line:#352c47;--card:#211f1b;--ink:#efeae0;--muted:#a39d91;--accent:#8fb8e3;--accent-ink:#10201a;--tile:#244a40;--tile-ink:#f3dc96;--used:#2b2924;--ok:#5fbf86;--bad:#e2776c;--line:#34312b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px 48px}
.wrap{max-width:1400px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:1.6rem;line-height:1.2}
.sub{color:var(--muted);margin:2px 0 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Brädet – mörk scen */
#boardView,.question{--stage:#14111f;--tileA:#4a4068;--tileB:#332c4a;--glow:#ffd36e;--catbg:#231a36}
#boardView{background:var(--stage);border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px}
.cat{background:var(--cc,var(--catbg));color:#fff;border:2px solid rgba(255,255,255,.14);text-shadow:0 1px 2px rgba(0,0,0,.35);border-radius:8px;padding:10px 6px;text-align:center;font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(.62rem,1.5vw,.95rem);line-height:1.2;display:flex;align-items:center;justify-content:center;min-height:64px;hyphens:auto;overflow-wrap:anywhere}
.tile{background:linear-gradient(160deg,var(--tileA),var(--tileB));color:var(--glow);border:none;border-radius:8px;aspect-ratio:16/10;min-height:0;font-size:clamp(1.1rem,min(3.6vw,5.5vh),2.8rem);font-weight:900;padding:0;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,211,110,.55),0 2px 0 rgba(0,0,0,.5);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.35);transition:transform .12s,filter .12s}
.tile:hover{transform:translateY(-2px);filter:brightness(1.15);border:none}
.tile.used{background:#1d1829;color:#4a4060;text-shadow:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.5);font-weight:700}
.tile.used:hover{transform:none}

/* Fråga – fyller brädet */
.question{background:radial-gradient(ellipse at center,var(--tileA),var(--tileB) 70%,var(--stage));color:#fff;border-radius:18px;padding:32px 24px;text-align:center;min-height:min(70vh,560px);display:flex;flex-direction:column;justify-content:center;gap:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.question .meta{color:#fff;background:var(--cc,transparent);align-self:center;padding:4px 14px;border-radius:999px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.question .q{font-size:clamp(1.4rem,4vw,2.6rem);font-weight:800;text-transform:uppercase;line-height:1.25;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.question .a{font-size:clamp(1.3rem,3.2vw,2rem);color:var(--glow);font-weight:800;margin:0;text-shadow:0 0 14px rgba(255,211,110,.5)}
.question .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.question button{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
.question button.primary{background:var(--glow);color:#241a05;border-color:var(--glow)}

/* Poängtavla – lagen i en vågrät rad */
.scores{margin-top:12px;background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:12px 14px}
.scores .head{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-bottom:10px}
h2{margin:0;font-size:1.1rem}
.hint{color:var(--muted);font-size:.85rem;margin:0;flex:1 1 220px}
.add{display:flex;gap:6px;flex:1 1 260px;max-width:380px;min-width:0}
.add input{flex:1;padding:6px 10px}
.add button{padding:6px 12px}
.teams{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;scroll-snap-type:x proximity}
.team{--tc:#7a6299;position:relative;flex:1 0 180px;max-width:280px;scroll-snap-align:start;background:var(--card);display:grid;grid-template-columns:auto 1fr;grid-template-areas:"av pts" "who who" "ctrl ctrl";gap:6px 8px;align-items:center;padding:10px;border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:14px;transition:box-shadow .2s}
.team.lead{box-shadow:0 0 0 2px #e8c45a,0 6px 18px rgba(232,196,90,.35)}
.avatar{grid-area:av;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--tc) 22%,var(--card));border:2px solid var(--tc);font-size:1.45rem;display:grid;place-items:center;padding:0;line-height:1;transition:transform .15s}
.avatar:hover{transform:rotate(-10deg) scale(1.08)}
.who{grid-area:who;min-width:0;display:grid;gap:4px}
.who .top{display:flex;align-items:center;gap:4px;min-width:0}
.medal{font-size:1.15rem;line-height:1;flex:none}
.rankno{flex:none;font-size:.75rem;font-weight:700;color:var(--muted);background:var(--panel);border-radius:999px;padding:1px 7px}
.team input{border-color:transparent;background:transparent;font-weight:800;font-size:1.05rem;color:var(--tc);padding:1px 4px;width:100%;text-overflow:ellipsis}
.team input:hover{border-color:var(--line)}
.meter{height:6px;border-radius:3px;background:color-mix(in srgb,var(--tc) 15%,transparent);overflow:hidden}
.meter i{display:block;height:100%;background:var(--tc);border-radius:3px;transition:width .4s ease}
.team .pts{grid-area:pts;position:relative;font-size:1.7rem;font-weight:900;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.team .pts.neg{color:var(--bad)}
.pts.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.3)}}
.float{position:absolute;right:0;top:-18px;font-size:.95rem;font-weight:800;pointer-events:none;animation:up 1s ease forwards}
.float.up{color:var(--ok)}.float.down{color:var(--bad)}
@keyframes up{to{transform:translateY(-22px);opacity:0}}
.ctrl{grid-area:ctrl;display:flex;gap:6px;align-items:center}
.pm{flex:1;height:36px;padding:0;font-size:1.3rem;font-weight:700}
.pm.plus{color:var(--ok)}.pm.minus{color:var(--bad)}
.del{border:none;background:none;color:var(--muted);padding:4px 6px;font-size:1rem}
.empty{color:var(--muted);padding:8px 4px}
.hidden{display:none!important}

/* Flikar */
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.tab{border:none;background:none;border-radius:9px;padding:6px 14px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab:hover:not([aria-selected="true"]){color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* Highscore */
#hsTab{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:18px}
.hs-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
.hs-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.hs-box h3{margin:0 0 10px;font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat .k{color:var(--muted);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:1.5rem;font-weight:900;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .d{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toplist li{display:grid;grid-template-columns:2.2em auto 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px}
.toplist li:nth-child(-n+3){background:color-mix(in srgb,#e8c45a 14%,transparent)}
.toplist .r{font-weight:800;text-align:center;color:var(--muted)}
.toplist .e{font-size:1.3rem;line-height:1}
.toplist .n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist .n small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.toplist .p{font-weight:900;font-variant-numeric:tabular-nums;font-size:1.1rem}
.rounds{display:grid;gap:10px}
.round{border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative}
.round.fresh{box-shadow:0 0 0 2px #e8c45a}
.round .when{color:var(--muted);font-size:.85rem;margin-right:28px}
.round .win{font-weight:800;margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:999px;padding:2px 10px 2px 6px;font-size:.9rem}
.chip b{font-variant-numeric:tabular-nums}
.round .del{position:absolute;top:6px;right:6px}
.hs-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:.85rem}
.hs-empty{text-align:center;color:var(--muted);padding:40px 12px}
.hs-empty .big{font-size:2.5rem}
@media (max-width:760px){.hs-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}

/* Stor skärm: allt får plats utan att scrolla */
@media (min-width:700px) and (min-height:540px){
  body{height:100vh;height:100dvh;padding:12px 16px}
  .wrap{height:100%;display:flex;flex-direction:column}
  header{flex:none}
  #gameTab{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #gameTab.hidden{display:none}
  #hsTab{flex:1 1 auto;min-height:0;overflow:auto}
  #boardView,#questionView{flex:1 1 auto;min-height:0}
  #boardView{display:flex}
  .board{flex:1;grid-template-rows:auto repeat(5,minmax(0,1fr))}
  .tile{aspect-ratio:auto}
  .question{min-height:0;padding:20px}
  .scores{flex:none}
}
@media (max-width:560px){
  #boardView{padding:6px;border-radius:12px}.board{gap:4px}.cat{min-height:52px;padding:6px 2px;border-radius:5px;letter-spacing:0}.tile{border-radius:5px}
  .team{flex-basis:160px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Frågesport</h1>
      <div class="tabs" role="tablist" aria-label="Vy">
        <button class="tab" role="tab" id="tabGame" aria-controls="gameTab" aria-selected="true">Spelbräde</button>
        <button class="tab" role="tab" id="tabHs" aria-controls="hsTab" aria-selected="false">🏆 Highscore</button>
      </div>
    </div>
    <div class="actions" id="gameActions">
      <button class="primary" id="finish">Avsluta &amp; spara runda</button>
      <button id="reset">Nytt spel</button>
    </div>
  </header>

  <div id="gameTab" role="tabpanel" aria-labelledby="tabGame">

  <section id="boardView"><div class="board" id="board"></div></section>

  <section id="questionView" class="question hidden" aria-live="polite">
    <div class="meta" id="qMeta"></div>
    <p class="q" id="qText"></p>
    <p class="a hidden" id="qAnswer"></p>
    <div class="row">
      <button class="primary" id="showAnswer">Visa svar</button>
      <button id="back">Tillbaka till brädet</button>
    </div>
  </section>

  <section class="scores">
    <div class="head">
      <h2>Poängställning</h2>
      <p class="hint" id="hint"></p>
      <form class="add" id="addForm">
        <input id="teamName" placeholder="Namn på person eller lag" maxlength="40" aria-label="Namn på person eller lag">
        <button class="primary" type="submit">Lägg till</button>
      </form>
    </div>
    <div class="teams" id="teams"></div>
  </section>
  </div>

  <section id="hsTab" class="hidden" role="tabpanel" aria-labelledby="tabHs"></section>
</div>

<script>
// [kategori, [[fråga, svar], ... 100 → 500]]
const CATS=[
["Allmänbildning",[
 ["Vad är Sveriges huvudstad?","Stockholm"],
 ["Vem skrev Pippi Långstrump?","Astrid Lindgren"],
 ["Vem målade Mona Lisa?","Leonardo da Vinci"],
 ["Vilket år föll Berlinmuren?","1989"],
 ["Vilket år blev Sverige medlem i EU?","1995"]]],
["Geografi",[
 ["Vilken är Sveriges största ö?","Gotland"],
 ["Genom vilken huvudstad flyter Seine?","Paris"],
 ["Vad är Australiens huvudstad?","Canberra"],
 ["I vilket land ligger Machu Picchu?","Peru"],
 ["Vilket är Afrikas till ytan största land?","Algeriet"]]],
["Vetenskap",[
 ["Vilken planet kallas den röda planeten?","Mars"],
 ["Vid hur många grader kokar vatten vid havsnivå?","100 °C"],
 ["Vilken gas tar växter upp vid fotosyntes?","Koldioxid"],
 ["Vilket organ producerar insulin?","Bukspottkörteln"],
 ["Hur många ben har en vuxen människa?","206"]]],
["Sport",[
 ["Hur många spelare har ett fotbollslag på planen?","11"],
 ["Vilket skidlopp går mellan Sälen och Mora?","Vasaloppet"],
 ["Hur lång är en maratonsträcka?","42,195 km"],
 ["Vilket land har vunnit flest fotbolls-VM för herrar?","Brasilien"],
 ["Vilken stad arrangerade vinter-OS 1994?","Lillehammer"]]],
["Musik & film",[
 ["Vilken svensk grupp vann Eurovision 1974 med \"Waterloo\"?","ABBA"],
 ["Vad heter lejonungen i Lejonkungen?","Simba"],
 ["Hur många strängar har en vanlig gitarr?","6"],
 ["Vem regisserade filmen Jurassic Park?","Steven Spielberg"],
 ["Vilken kompositör skrev Fyra årstiderna?","Antonio Vivaldi"]]]
];
const CAT_COLORS=["#3f7f8c","#5f8a55","#a0703a","#9a5468","#4f6fa3","#7a6299"];
const VALUES=[100,200,300,400,500];
const KEY="fs-board-v1",$=id=>document.getElementById(id);

const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}};
let state=load()||{teams:[],used:[],nextId:1};
let active=null,lastValue=null; // active = {c,r}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const isUsed=(c,r)=>state.used.includes(c+"-"+r);

function renderBoard(){
  const b=$("board");b.style.setProperty("--cols",CATS.length);b.innerHTML="";
  CATS.forEach(([name],c)=>{const d=document.createElement("div");d.className="cat";d.textContent=name;d.style.setProperty("--cc",CAT_COLORS[c%CAT_COLORS.length]);b.append(d)});
  VALUES.forEach((v,r)=>CATS.forEach(([name],c)=>{
    const t=document.createElement("button");
    t.className="tile"+(isUsed(c,r)?" used":"");t.textContent=v;
    t.setAttribute("aria-label",`${name} för ${v} poäng`+(isUsed(c,r)?" (spelad)":""));
    t.onclick=()=>openQ(c,r);b.append(t);
  }));
}

function openQ(c,r){
  active={c,r};lastValue=VALUES[r];
  const [name,qs]=CATS[c],[q,a]=qs[r];
  $("qMeta").textContent=`${name} · ${VALUES[r]} poäng`;$("qMeta").style.setProperty("--cc",CAT_COLORS[c%CAT_COLORS.length]);
  $("qText").textContent=q;$("qAnswer").textContent=a;
  $("qAnswer").classList.add("hidden");$("showAnswer").classList.remove("hidden");
  $("boardView").classList.add("hidden");$("questionView").classList.remove("hidden");
  renderTeams();$("questionView").scrollIntoView({block:"nearest"});
}
function closeQ(){
  if(active){const k=active.c+"-"+active.r;if(!state.used.includes(k))state.used.push(k);save()}
  active=null;$("questionView").classList.add("hidden");$("boardView").classList.remove("hidden");
  renderBoard();renderTeams();
}
$("showAnswer").onclick=()=>{$("qAnswer").classList.remove("hidden");$("showAnswer").classList.add("hidden")};
$("back").onclick=closeQ;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&active)closeQ()});

const TEAM_COLORS=["#c0567a","#3f7f8c","#c27c2c","#5f8a55","#4f6fa3","#8a5fb0","#b5523d","#2f8f7a"];
const EMOJIS=["🤡","🧌","👹","👽","🐗","🧟","🦨","🐷","👺","🦝","🐡","🤖","💩","🦃","🧛","🐀","🪳","🦧","💀"];
const MEDALS=["🥇","🥈","🥉"];
let flash=null; // {id,delta}
function renderTeams(){
  const v=active?VALUES[active.r]:lastValue;
  $("hint").textContent=v
    ?`Plus och minus ger ±${v} poäng`+(active?" för den aktuella frågan.":" (senast valda fråga).")
    :"Lägg till deltagare och välj en fråga – sedan ger plus/minus frågans poäng.";
  const box=$("teams");
  const before=new Map([...box.querySelectorAll(".team")].map(el=>[el.dataset.id,el.getBoundingClientRect().left]));
  box.innerHTML="";
  if(!state.teams.length){box.innerHTML='<div class="empty">Inga deltagare än – lägg till det första laget! 🎉</div>';return}
  const max=Math.max(...state.teams.map(t=>t.score));
  const scale=Math.max(max,...state.teams.map(t=>Math.abs(t.score)),1);
  const sorted=[...state.teams].map(t=>t.score).sort((a,b)=>b-a);
  [...state.teams].sort((a,b)=>b.score-a.score).forEach(t=>{
    if(!EMOJIS.includes(t.emoji))t.emoji=EMOJIS[(t.id-1)%EMOJIS.length];
    const color=TEAM_COLORS[(t.id-1)%TEAM_COLORS.length];
    const rank=sorted.indexOf(t.score);
    const row=document.createElement("div");
    row.className="team"+(t.score===max&&max>0?" lead":"");row.dataset.id=t.id;row.style.setProperty("--tc",color);

    const av=document.createElement("button");av.className="avatar";av.textContent=t.emoji;
    av.title="Byt figur";av.setAttribute("aria-label","Byt figur för "+t.name);
    av.onclick=()=>{t.emoji=EMOJIS[(EMOJIS.indexOf(t.emoji)+1)%EMOJIS.length];save();renderTeams()};

    const who=document.createElement("div");who.className="who";
    const top=document.createElement("div");top.className="top";
    const badge=document.createElement("span");
    if(t.score>0&&rank<3){badge.className="medal";badge.textContent=MEDALS[rank];badge.title=(rank+1)+":a plats"}
    else{badge.className="rankno";badge.textContent=(rank+1)+"."}
    const name=document.createElement("input");name.value=t.name;name.setAttribute("aria-label","Namn");
    name.onchange=()=>{t.name=name.value.trim()||t.name;name.value=t.name;save()};
    top.append(badge,name);
    const meter=document.createElement("div");meter.className="meter";
    const fill=document.createElement("i");fill.style.width=Math.max(0,t.score)/scale*100+"%";meter.append(fill);
    who.append(top,meter);

    const pts=document.createElement("span");pts.className="pts"+(t.score<0?" neg":"");pts.textContent=t.score;
    if(flash&&flash.id===t.id){pts.classList.add("pop");const f=document.createElement("span");
      f.className="float "+(flash.delta>0?"up":"down");f.textContent=(flash.delta>0?"+":"−")+Math.abs(flash.delta);pts.append(f)}

    const mk=(cls,txt,sign,label)=>{const b=document.createElement("button");b.className="pm "+cls;b.textContent=txt;b.disabled=!v;
      b.setAttribute("aria-label",`${label} ${v||""} poäng för ${t.name}`);
      b.onclick=()=>{t.score+=sign*v;flash={id:t.id,delta:sign*v};save();renderTeams();flash=null};return b};
    const del=document.createElement("button");del.className="del";del.textContent="✕";del.title="Ta bort";del.setAttribute("aria-label","Ta bort "+t.name);
    del.onclick=()=>{if(confirm(`Ta bort ${t.name}?`)){state.teams=state.teams.filter(x=>x!==t);save();renderTeams()}};
    const ctrl=document.createElement("div");ctrl.className="ctrl";
    ctrl.append(mk("minus","−",-1,"Dra av"),mk("plus","+",1,"Lägg till"),del);
    row.append(av,who,pts,ctrl);
    box.append(row);
  });
  // Glid mjukt till nya platser när ordningen ändras
  box.querySelectorAll(".team").forEach(el=>{
    const old=before.get(el.dataset.id);if(old==null)return;
    const dx=old-el.getBoundingClientRect().left;if(!dx)return;
    el.animate([{transform:`translateX(${dx}px)`},{transform:"none"}],{duration:450,easing:"cubic-bezier(.2,.8,.2,1)"});
  });
  save();
}
$("addForm").onsubmit=e=>{
  e.preventDefault();const n=$("teamName").value.trim();if(!n)return;
  state.teams.push({id:state.nextId++,name:n,score:0});$("teamName").value="";save();renderTeams();$("teamName").focus();
};
function resetRound(){
  state.used=[];state.teams.forEach(t=>t.score=0);active=null;lastValue=null;save();
  $("questionView").classList.add("hidden");$("boardView").classList.remove("hidden");renderBoard();renderTeams();
}
$("reset").onclick=()=>{
  if(!confirm("Starta nytt spel utan att spara? Brädet återställs och alla poäng nollas (deltagarna behålls)."))return;
  resetRound();
};

/* ---- Highscore ---- */
const HKEY="fs-history-v1";
let history=(()=>{try{return JSON.parse(localStorage.getItem(HKEY))||[]}catch{return[]}})();
let freshId=null;
const saveHistory=()=>{try{localStorage.setItem(HKEY,JSON.stringify(history))}catch{}};
const teamColor=t=>TEAM_COLORS[(t.id-1)%TEAM_COLORS.length];
const fmtDate=iso=>new Date(iso).toLocaleString("sv-SE",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("finish").onclick=()=>{
  if(!state.teams.length){alert("Lägg till minst ett lag innan du sparar en runda.");return}
  const played=state.used.length,total=CATS.length*VALUES.length;
  if(!confirm(`Avsluta rundan och spara resultatet i highscore?\n(${played} av ${total} frågor spelade.) Brädet och poängen nollställs sedan.`))return;
  const round={id:Date.now(),date:new Date().toISOString(),played,total,
    teams:[...state.teams].sort((a,b)=>b.score-a.score).map(t=>({name:t.name,emoji:t.emoji,color:teamColor(t),score:t.score}))};
  history.unshift(round);saveHistory();freshId=round.id;
  resetRound();showTab("hs");
};

function renderHs(){
  const box=$("hsTab");
  if(!history.length){
    box.innerHTML='<div class="hs-empty"><div class="big">🏆</div><h2>Inga sparade rundor än</h2><p>Spela en runda och klicka på <b>Avsluta &amp; spara runda</b> – då hamnar resultatet här.</p></div>';
    return;
  }
  const all=history.flatMap(r=>r.teams.map(t=>({...t,date:r.date})));
  const top=all.filter(t=>t.score>0).sort((a,b)=>b.score-a.score).slice(0,10);
  const wins={};history.forEach(r=>{const m=r.teams[0].score;if(m<=0)return;r.teams.filter(t=>t.score===m).forEach(t=>{wins[t.name]=(wins[t.name]||0)+1})});
  const best=Object.entries(wins).sort((a,b)=>b[1]-a[1])[0];
  const rec=top[0];
  const medal=i=>["🥇","🥈","🥉"][i]||(i+1)+".";
  box.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Rekord</div><div class="v">${rec?rec.score:"–"}</div><div class="d">${rec?esc(rec.emoji||"")+" "+esc(rec.name):"Inga poäng än"}</div></div>
      <div class="stat"><div class="k">Flest vinster</div><div class="v">${best?esc(best[0]):"–"}</div><div class="d">${best?best[1]+(best[1]===1?" vinst":" vinster"):"Ingen vinnare än"}</div></div>
      <div class="stat"><div class="k">Spelade rundor</div><div class="v">${history.length}</div><div class="d">Senast ${fmtDate(history[0].date)}</div></div>
    </div>
    <div class="hs-grid">
      <div class="hs-box"><h3>Bästa resultat genom tiderna</h3><ol class="toplist">
        ${top.length?"":"<li>Inga poäng registrerade än.</li>"}${top.map((t,i)=>`<li><span class="r">${medal(i)}</span><span class="e">${esc(t.emoji||"")}</span><span class="n">${esc(t.name)}<small>${fmtDate(t.date)}</small></span><span class="p">${t.score}</span></li>`).join("")}
      </ol></div>
      <div class="hs-box"><h3>Tidigare rundor</h3><div class="rounds">
        ${history.map(r=>{const m=r.teams[0].score,w=r.teams.filter(t=>t.score===m&&m>0);
          return `<div class="round${r.id===freshId?" fresh":""}">
            <div class="when">${fmtDate(r.date)} · ${r.played} av ${r.total} frågor</div>
            <div class="win">${w.length?"🏆 "+w.map(t=>esc((t.emoji||"")+" "+t.name)).join(" & ")+` – ${m} poäng`:"Ingen vinnare"}</div>
            <div class="chips">${r.teams.map(t=>`<span class="chip" style="--tc:${t.color}">${esc(t.emoji||"")} ${esc(t.name)} <b>${t.score}</b></span>`).join("")}</div>
            <button class="del" data-id="${r.id}" title="Ta bort rundan" aria-label="Ta bort rundan från ${fmtDate(r.date)}">✕</button>
          </div>`}).join("")}
      </div></div>
    </div>
    <div class="hs-foot"><span>Highscore sparas i den här webbläsaren.</span><button id="clearHs">Rensa all historik</button></div>`;
  box.querySelectorAll(".round .del").forEach(b=>b.onclick=()=>{
    if(!confirm("Ta bort den här rundan från highscore?"))return;
    history=history.filter(r=>r.id!==+b.dataset.id);saveHistory();renderHs()});
  $("clearHs").onclick=()=>{if(confirm("Rensa all highscore-historik? Det går inte att ångra.")){history=[];saveHistory();renderHs()}};
}

function showTab(which){
  const hs=which==="hs";
  $("tabGame").setAttribute("aria-selected",!hs);$("tabHs").setAttribute("aria-selected",hs);
  $("gameTab").classList.toggle("hidden",hs);$("hsTab").classList.toggle("hidden",!hs);
  $("gameActions").classList.toggle("hidden",hs);
  if(hs)renderHs();else freshId=null;
}
$("tabGame").onclick=()=>showTab("game");
$("tabHs").onclick=()=>showTab("hs");
renderBoard();renderTeams();
</script>
</body>
</html>
