<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frågesport</title>
<style>
:root{--bg:#dcebf7;--card:#fff;--ink:#1d1b18;--muted:#6b665d;--accent:#2f5a86;--accent-ink:#fff;--tile:#2f5d50;--tile-ink:#f6e7b8;--used:#e2ddd2;--ok:#2e7d4f;--bad:#b3392f;--line:#e2ddd2}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a26;--card:#211f1b;--ink:#efeae0;--muted:#a39d91;--accent:#8fb8e3;--accent-ink:#10201a;--tile:#244a40;--tile-ink:#f3dc96;--used:#2b2924;--ok:#5fbf86;--bad:#e2776c;--line:#34312b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px 48px}
.wrap{max-width:1000px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:1.9rem}
h2{margin:0 0 12px;font-size:1.2rem}
.sub{color:var(--muted);margin:2px 0 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Brädet – mörk scen */
#boardView,.question{--stage:#14111f;--tileA:#5b2a86;--tileB:#3a1a5c;--glow:#ffd36e;--catbg:#231a36}
#boardView{background:var(--stage);border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px}
.cat{background:var(--cc,var(--catbg));color:#fff;border:2px solid rgba(255,255,255,.14);text-shadow:0 1px 2px rgba(0,0,0,.35);border-radius:8px;padding:10px 6px;text-align:center;font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(.62rem,1.5vw,.95rem);line-height:1.2;display:flex;align-items:center;justify-content:center;min-height:64px;hyphens:auto;overflow-wrap:anywhere}
.tile{background:linear-gradient(160deg,var(--tileA),var(--tileB));color:var(--glow);border:none;border-radius:8px;aspect-ratio:16/10;font-size:clamp(1.1rem,3.6vw,2.4rem);font-weight:900;padding:0;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,211,110,.55),0 2px 0 rgba(0,0,0,.5);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.35);transition:transform .12s,filter .12s}
.tile:hover{transform:translateY(-2px);filter:brightness(1.15);border:none}
.tile.used{background:#1d1829;color:#4a4060;text-shadow:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.5);font-weight:700}
.tile.used:hover{transform:none}

/* Fråga – fyller brädet */
.question{background:radial-gradient(ellipse at center,var(--tileA),var(--tileB) 70%,var(--stage));color:#fff;border-radius:18px;padding:32px 24px;text-align:center;min-height:min(70vh,560px);display:flex;flex-direction:column;justify-content:center;gap:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.question .meta{color:#fff;background:var(--cc,transparent);align-self:center;padding:4px 14px;border-radius:999px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.question .q{font-size:clamp(1.4rem,4vw,2.6rem);font-weight:800;text-transform:uppercase;line-height:1.25;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.question .a{font-size:clamp(1.3rem,3.2vw,2rem);color:var(--glow);font-weight:800;margin:0;text-shadow:0 0 14px rgba(255,211,110,.5)}
.question .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.question button{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
.question button.primary{background:var(--glow);color:#241a05;border-color:var(--glow)}

/* Poängtavla */
.scores{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.scores .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.add{display:flex;gap:8px;margin-bottom:14px}
.add input{flex:1}
.teams{display:grid;gap:8px}
.team{display:grid;grid-template-columns:28px 1fr auto auto auto auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px}
.team.lead{border-color:#e0b64a;box-shadow:inset 4px 0 0 #e0b64a}
.team .rank{color:var(--muted);text-align:center;font-weight:600}
.team input{border-color:transparent;background:transparent;font-weight:600;width:100%}
.team input:hover{border-color:var(--line)}
.team .pts{font-size:1.4rem;font-weight:800;min-width:4ch;text-align:right;font-variant-numeric:tabular-nums}
.team .pts.neg{color:var(--bad)}
.pm{width:44px;height:40px;padding:0;font-size:1.3rem;font-weight:700}
.pm.plus{color:var(--ok)}.pm.minus{color:var(--bad)}
.del{border:none;background:none;color:var(--muted);padding:4px 8px;font-size:1.1rem}
.empty{color:var(--muted);text-align:center;padding:12px}
.hidden{display:none!important}
@media (max-width:560px){
  #boardView{padding:6px;border-radius:12px}.board{gap:4px}.cat{min-height:52px;padding:6px 2px;border-radius:5px;letter-spacing:0}.tile{border-radius:5px}
  .team{grid-template-columns:1fr auto auto auto auto;}
  .team .rank{display:none}
  .pm{width:38px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Frågesport</h1>
      <p class="sub">Välj en ruta. Högre poäng betyder svårare fråga.</p>
    </div>
    <button id="reset">Nytt spel</button>
  </header>

  <section id="boardView"><div class="board" id="board"></div></section>

  <section id="questionView" class="question hidden" aria-live="polite">
    <div class="meta" id="qMeta"></div>
    <p class="q" id="qText"></p>
    <p class="a hidden" id="qAnswer"></p>
    <div class="row">
      <button class="primary" id="showAnswer">Visa svar</button>
      <button id="back">Tillbaka till brädet</button>
    </div>
  </section>

  <section class="scores">
    <div class="head">
      <h2>Poängställning</h2>
    </div>
    <p class="hint" id="hint"></p>
    <form class="add" id="addForm">
      <input id="teamName" placeholder="Namn på person eller lag" maxlength="40" aria-label="Namn på person eller lag">
      <button class="primary" type="submit">Lägg till</button>
    </form>
    <div class="teams" id="teams"></div>
  </section>
</div>

<script>
// [kategori, [[fråga, svar], ... 100 → 500]]
const CATS=[
["Allmänbildning",[
 ["Vad är Sveriges huvudstad?","Stockholm"],
 ["Vem skrev Pippi Långstrump?","Astrid Lindgren"],
 ["Vem målade Mona Lisa?","Leonardo da Vinci"],
 ["Vilket år föll Berlinmuren?","1989"],
 ["Vilket år blev Sverige medlem i EU?","1995"]]],
["Geografi",[
 ["Vilken är Sveriges största ö?","Gotland"],
 ["Genom vilken huvudstad flyter Seine?","Paris"],
 ["Vad är Australiens huvudstad?","Canberra"],
 ["I vilket land ligger Machu Picchu?","Peru"],
 ["Vilket är Afrikas till ytan största land?","Algeriet"]]],
["Vetenskap",[
 ["Vilken planet kallas den röda planeten?","Mars"],
 ["Vid hur många grader kokar vatten vid havsnivå?","100 °C"],
 ["Vilken gas tar växter upp vid fotosyntes?","Koldioxid"],
 ["Vilket organ producerar insulin?","Bukspottkörteln"],
 ["Hur många ben har en vuxen människa?","206"]]],
["Sport",[
 ["Hur många spelare har ett fotbollslag på planen?","11"],
 ["Vilket skidlopp går mellan Sälen och Mora?","Vasaloppet"],
 ["Hur lång är en maratonsträcka?","42,195 km"],
 ["Vilket land har vunnit flest fotbolls-VM för herrar?","Brasilien"],
 ["Vilken stad arrangerade vinter-OS 1994?","Lillehammer"]]],
["Musik & film",[
 ["Vilken svensk grupp vann Eurovision 1974 med \"Waterloo\"?","ABBA"],
 ["Vad heter lejonungen i Lejonkungen?","Simba"],
 ["Hur många strängar har en vanlig gitarr?","6"],
 ["Vem regisserade filmen Jurassic Park?","Steven Spielberg"],
 ["Vilken kompositör skrev Fyra årstiderna?","Antonio Vivaldi"]]]
];
const CAT_COLORS=["#3f7f8c","#5f8a55","#a0703a","#9a5468","#4f6fa3","#7a6299"];
const VALUES=[100,200,300,400,500];
const KEY="fs-board-v1",$=id=>document.getElementById(id);

const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}};
let state=load()||{teams:[],used:[],nextId:1};
let active=null,lastValue=null; // active = {c,r}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const isUsed=(c,r)=>state.used.includes(c+"-"+r);

function renderBoard(){
  const b=$("board");b.style.setProperty("--cols",CATS.length);b.innerHTML="";
  CATS.forEach(([name],c)=>{const d=document.createElement("div");d.className="cat";d.textContent=name;d.style.setProperty("--cc",CAT_COLORS[c%CAT_COLORS.length]);b.append(d)});
  VALUES.forEach((v,r)=>CATS.forEach(([name],c)=>{
    const t=document.createElement("button");
    t.className="tile"+(isUsed(c,r)?" used":"");t.textContent=v;
    t.setAttribute("aria-label",`${name} för ${v} poäng`+(isUsed(c,r)?" (spelad)":""));
    t.onclick=()=>openQ(c,r);b.append(t);
  }));
}

function openQ(c,r){
  active={c,r};lastValue=VALUES[r];
  const [name,qs]=CATS[c],[q,a]=qs[r];
  $("qMeta").textContent=`${name} · ${VALUES[r]} poäng`;$("qMeta").style.setProperty("--cc",CAT_COLORS[c%CAT_COLORS.length]);
  $("qText").textContent=q;$("qAnswer").textContent=a;
  $("qAnswer").classList.add("hidden");$("showAnswer").classList.remove("hidden");
  $("boardView").classList.add("hidden");$("questionView").classList.remove("hidden");
  renderTeams();$("questionView").scrollIntoView({block:"nearest"});
}
function closeQ(){
  if(active){const k=active.c+"-"+active.r;if(!state.used.includes(k))state.used.push(k);save()}
  active=null;$("questionView").classList.add("hidden");$("boardView").classList.remove("hidden");
  renderBoard();renderTeams();
}
$("showAnswer").onclick=()=>{$("qAnswer").classList.remove("hidden");$("showAnswer").classList.add("hidden")};
$("back").onclick=closeQ;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&active)closeQ()});

function renderTeams(){
  const v=active?VALUES[active.r]:lastValue;
  $("hint").textContent=v
    ?`Plus och minus ger ±${v} poäng`+(active?" för den aktuella frågan.":" (senast valda fråga).")
    :"Lägg till deltagare och välj en fråga – sedan ger plus/minus frågans poäng.";
  const box=$("teams");box.innerHTML="";
  if(!state.teams.length){box.innerHTML='<div class="empty">Inga deltagare än.</div>';return}
  const max=Math.max(...state.teams.map(t=>t.score));
  const order=[...state.teams].sort((a,b)=>b.score-a.score);
  state.teams.forEach(t=>{
    const row=document.createElement("div");
    row.className="team"+(t.score===max&&max>0?" lead":"");
    const rank=document.createElement("span");rank.className="rank";rank.textContent=(order.findIndex(o=>o.score===t.score)+1)+".";
    const name=document.createElement("input");name.value=t.name;name.setAttribute("aria-label","Namn");
    name.onchange=()=>{t.name=name.value.trim()||t.name;name.value=t.name;save()};
    const pts=document.createElement("span");pts.className="pts"+(t.score<0?" neg":"");pts.textContent=t.score;
    const mk=(cls,txt,sign,label)=>{const b=document.createElement("button");b.className="pm "+cls;b.textContent=txt;b.disabled=!v;
      b.setAttribute("aria-label",`${label} ${v||""} poäng för ${t.name}`);b.onclick=()=>{t.score+=sign*v;save();renderTeams()};return b};
    const del=document.createElement("button");del.className="del";del.textContent="✕";del.title="Ta bort";del.setAttribute("aria-label","Ta bort "+t.name);
    del.onclick=()=>{if(confirm(`Ta bort ${t.name}?`)){state.teams=state.teams.filter(x=>x!==t);save();renderTeams()}};
    row.append(rank,name,pts,mk("minus","−",-1,"Dra av"),mk("plus","+",1,"Lägg till"),del);
    box.append(row);
  });
}
$("addForm").onsubmit=e=>{
  e.preventDefault();const n=$("teamName").value.trim();if(!n)return;
  state.teams.push({id:state.nextId++,name:n,score:0});$("teamName").value="";save();renderTeams();$("teamName").focus();
};
$("reset").onclick=()=>{
  if(!confirm("Starta nytt spel? Brädet återställs och alla poäng nollas (deltagarna behålls)."))return;
  state.used=[];state.teams.forEach(t=>t.score=0);active=null;lastValue=null;save();
  $("questionView").classList.add("hidden");$("boardView").classList.remove("hidden");renderBoard();renderTeams();
};
renderBoard();renderTeams();
</script>
</body>
</html>
